<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#0b1221"/>
  <text x="30" y="38" fill="#e2e8f0" font-size="20" font-weight="700">Oracle Q1 FY2027: Headline Growth vs. Stock Reaction</text>
  <text x="30" y="60" fill="#64748b" font-size="13">Year-over-year growth (%) reported Sept. 11, 2026, vs. Friday's closing stock move</text>

  <!-- zero line -->
  <line x1="250" y1="85" x2="250" y2="400" stroke="#1e2d45" stroke-width="1"/>
  <text x="250" y="420" fill="#64748b" font-size="12" text-anchor="middle">0%</text>

  <!-- Total Revenue +30% -->
  <text x="240" y="130" fill="#e2e8f0" font-size="14" text-anchor="end">Total Revenue</text>
  <rect x="250" y="108" width="124" height="40" fill="#0ecb81"/>
  <text x="384" y="133" fill="#0ecb81" font-size="15" font-weight="700">+30%</text>

  <!-- Cloud Revenue +62% -->
  <text x="240" y="210" fill="#e2e8f0" font-size="14" text-anchor="end">Cloud Revenue</text>
  <rect x="250" y="188" width="256" height="40" fill="#0ecb81"/>
  <text x="516" y="213" fill="#0ecb81" font-size="15" font-weight="700">+62%</text>

  <!-- Cloud Infrastructure +121% -->
  <text x="240" y="290" fill="#e2e8f0" font-size="14" text-anchor="end">Cloud Infrastructure</text>
  <rect x="250" y="268" width="500" height="40" fill="#0ecb81"/>
  <text x="710" y="293" fill="#04150d" font-size="15" font-weight="700">+121%</text>

  <!-- ORCL stock -2% -->
  <text x="240" y="370" fill="#e2e8f0" font-size="14" text-anchor="end">ORCL Stock (Fri. close)</text>
  <rect x="242" y="348" width="8" height="40" fill="#f6465d"/>
  <text x="150" y="373" fill="#f6465d" font-size="15" font-weight="700">-2%</text>

  <text x="30" y="440" fill="#64748b" font-size="11">Source: CNBC, Sept. 11, 2026</text>
</svg>
